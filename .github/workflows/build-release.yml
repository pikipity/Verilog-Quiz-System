name: Build Release

# 触发条件：只有 main 分支的 push 才触发（包括 PR 合并）
on:
  push:
    branches:
      - main

  # 允许手动触发
  workflow_dispatch:

# 权限设置
permissions:
  contents: write    # 用于创建 Release
  actions: read

# 使用 Node.js 24（消除 deprecation 警告）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false    # 一个平台失败不影响其他平台
      matrix:
        include:
          - os: windows-latest
            target: windows
            ext: .exe
            build_cmd: windows
          - os: ubuntu-22.04
            target: linux
            ext: ''
            build_cmd: linux
          - os: macos-latest
            target: macos
            ext: ''
            build_cmd: macos
          - os: macos-13
            target: macos-intel
            ext: ''
            build_cmd: macos
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: ''
            build_cmd: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONLEGACYWINDOWSSTDIO: utf-8

    steps:
      # ========== 1. 检出代码 ==========
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 2. 安装 Linux 系统依赖（x64 & ARM64）==========
      - name: Install Linux dependencies
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libblkid-dev liblzma-dev libgtk-3-dev libstdc++-12-dev

      # ========== 3. 预装 Flutter SDK ==========
      # flet 0.85.2 硬编码了 Flutter 3.41.7（不存在版本），所有非 Windows 平台需预装稳定版
      - name: Setup Flutter SDK (Linux/macOS)
        if: matrix.target != 'windows'
        run: |
          echo "Installing Flutter SDK for ${{ matrix.target }}..."
          # clone 到项目目录外，避免被 flet build 当作应用资源打包进去
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
          export PATH="$HOME/flutter/bin:$PATH"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          # 下载完整的 Flutter 构建依赖
          flutter config --no-analytics
          flutter precache --${{ matrix.build_cmd }}
          flutter --version
          # 提取实际安装的 Flutter 版本，写入环境变量供后续步骤使用
          FLUTTER_VER=$(flutter --version | head -1 | awk '{print $2}')
          echo "FLUTTER_VERSION=$FLUTTER_VER" >> "$GITHUB_ENV"
          echo "Installed Flutter $FLUTTER_VER"

      # ========== 4. 设置 Python ==========
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ========== 5. 安装 Python 依赖 ==========
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-desktop cryptography requests

      # ========== 6. 修改 flet 硬编码的 flutter_version（绕过不存在的 3.41.7）==========
      - name: Patch flet Flutter version
        if: matrix.target != 'windows'
        run: |
          python -c "
          import os, re, flet, shutil
          
          flet_dir = os.path.dirname(flet.__file__)
          version_py = os.path.join(flet_dir, 'version.py')
          
          # 删除 Python 字节码缓存，确保修改后重新导入生效
          for root, dirs, files in os.walk(flet_dir):
              for d in list(dirs):
                  if d == '__pycache__':
                      shutil.rmtree(os.path.join(root, d))
                      dirs.remove(d)
              for f in files:
                  if f.endswith('.pyc'):
                      os.remove(os.path.join(root, f))
          
          print('version.py path:', version_py)
          
          with open(version_py, 'r') as f:
              content = f.read()
          
          print('Lines containing flutter_version:')
          for i, line in enumerate(content.split('\n')):
              if 'flutter_version' in line:
                  print(f'  Line {i+1}: {repr(line)}')
          
          # 尝试正则替换
          new_content = re.sub(r'flutter_version\s*=\s*[\"\'][^\"\']*[\"\']', f'flutter_version = \"{os.environ[\"FLUTTER_VERSION\"]}\"', content)
          
          # 如果正则无匹配，使用行级替换兜底
          if new_content == content:
              print('Regex did not match, trying line-by-line fallback...')
              lines = content.split('\n')
              new_lines = []
              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith('flutter_version') and '=' in stripped and not stripped.startswith('def ') and not stripped.startswith('#'):
                      indent = line[:len(line) - len(line.lstrip())]
                      line = indent + f'flutter_version = \"{os.environ[\"FLUTTER_VERSION\"]}\"'
                      print(f'  Replaced: {line}')
                  new_lines.append(line)
              new_content = '\n'.join(new_lines)
          
          with open(version_py, 'w') as f:
              f.write(new_content)
          
          print('Patched', version_py)
          "
          # 强制重新加载模块确认修改生效
          python -c "
          import importlib, flet.version
          importlib.reload(flet.version)
          print('flet flutter_version after patch:', flet.version.flutter_version)
          "
          # 同时验证 flet_cli 读到的值
          python -c "
          import flet.version
          print('flet.version.flutter_version =', flet.version.flutter_version)
          "
          # 确保环境变量也设置了（供 flet build 内部可能用到）
          echo "FLET_FLUTTER_VERSION=$FLUTTER_VERSION" >> "$GITHUB_ENV"

      # ========== 7. 用 flet build 打包 ==========
      - name: Build with flet (Windows)
        if: matrix.target == 'windows'
        shell: cmd
        run: |
          chcp 65001 >nul
          echo y | flet build windows --output dist

      - name: Build with flet (Linux/macOS)
        if: matrix.target != 'windows'
        run: flet build ${{ matrix.build_cmd }} --output dist

      # ========== 8. 整理构建产物：清理开发文件并打包成 zip ==========
      - name: Prepare artifact
        shell: bash
        run: |
          set -e
          # flet build --output dist 直接输出到 dist/ 目录
          if [ -f "dist/verilog-quiz-system" ] || [ -d "dist/verilog-quiz-system" ] || [ -f "dist/verilog-quiz-system.exe" ] || [ -d "dist/verilog-quiz-system.app" ]; then
            PLATFORM_DIR="dist"
          elif [ -d "dist/${{ matrix.target }}" ]; then
            PLATFORM_DIR="dist/${{ matrix.target }}"
          elif [ -d "build/${{ matrix.target }}" ]; then
            PLATFORM_DIR="build/${{ matrix.target }}"
          else
            echo "ERROR: flet build output not found!"
            echo "Contents of dist/:"
            ls -la dist/ 2>/dev/null || true
            echo "Contents of build/:"
            ls -la build/ 2>/dev/null || true
            exit 1
          fi

          echo "Original size before cleanup:"
          du -sh "$PLATFORM_DIR" || true
          echo "---"
          echo "Top 20 largest files/directories:"
          du -ah "$PLATFORM_DIR" 2>/dev/null | sort -rh 2>/dev/null | head -20 || true
          echo "---"

          # ========== 清理不需要的 Flutter SDK 开发文件 ==========
          # 这些文件被 flet build 带入输出目录，运行时完全不需要，
          # 但会占用大量磁盘空间（dart-sdk 可达 500MB+）

          # 0. 删除可能被误打包进来的完整 Flutter SDK 目录
          find "$PLATFORM_DIR" -maxdepth 2 -type d -name "flutter" -exec rm -rf {} + 2>/dev/null || true

          # 1. 删除 dart-sdk 完整目录（开发工具，运行时不需要）
          find "$PLATFORM_DIR" -type d -name "dart-sdk" -exec rm -rf {} + 2>/dev/null || true

          # 2. 删除 Flutter 开发工具快照
          find "$PLATFORM_DIR" -type f \( \
            -name "flutter_tools.snapshot" -o \
            -name "analysis_server.dart.snapshot" -o \
            -name "dart2js.dart.snapshot" -o \
            -name "gen_snapshot" -o \
            -name "dart" -o \
            -name "dart.exe" \
          \) -delete 2>/dev/null || true

          # 3. 删除缓存中的构建产物和包缓存（保留 engine 库）
          find "$PLATFORM_DIR" -type d -path "*/flutter/bin/cache/artifacts" -exec rm -rf {} + 2>/dev/null || true
          find "$PLATFORM_DIR" -type d -path "*/flutter/bin/cache/pkg" -exec rm -rf {} + 2>/dev/null || true

          # 4. 删除示例、文档、测试代码
          find "$PLATFORM_DIR" -type d \( \
            -name "examples" -o \
            -name "example" -o \
            -name "docs" -o \
            -name "doc" -o \
            -name "test" -o \
            -name "tests" -o \
            -name "benchmark" -o \
            -name "dev" \
          \) -exec rm -rf {} + 2>/dev/null || true

          # 5. 删除静态库（.a）和符号表（运行时只需要 .so/.dll/.dylib）
          find "$PLATFORM_DIR" -type f -name "*.a" -delete 2>/dev/null || true

          # 6. 删除头文件和开发用的 C++ 源码
          find "$PLATFORM_DIR" -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.cc" -o -name "*.cpp" \) -delete 2>/dev/null || true

          # 7. 删除不需要的字体缓存和中间文件
          find "$PLATFORM_DIR" -type f -name "*.stamp" -delete 2>/dev/null || true
          find "$PLATFORM_DIR" -type f -name "*.d" -delete 2>/dev/null || true

          # macOS 特定清理（dSYM 调试符号通常非常大）
          if [ "${{ matrix.target }}" = "macos" ] || [ "${{ matrix.target }}" = "macos-intel" ]; then
            echo "Running macOS-specific cleanup..."
            find "$PLATFORM_DIR" -type d -name "*.dSYM" -exec rm -rf {} + 2>/dev/null || true
            find "$PLATFORM_DIR" -type d -name "Headers" -exec rm -rf {} + 2>/dev/null || true
            find "$PLATFORM_DIR" -type d -name "PrivateHeaders" -exec rm -rf {} + 2>/dev/null || true
            find "$PLATFORM_DIR" -type d -name "Modules" -exec rm -rf {} + 2>/dev/null || true
            echo "macOS cleanup done"
          fi

          echo "Size after cleanup:"
          du -sh "$PLATFORM_DIR" || true
          echo "---"
          echo "Files remaining in $PLATFORM_DIR:"
          ls -la "$PLATFORM_DIR"

          # ========== Linux VM 兼容 wrapper 脚本 ==========
          # Flutter Linux embedder 在 VirtualBox 等 VM 的 GPU 虚拟化环境中
          # 可能因 OpenGL 驱动问题导致白屏。wrapper 脚本检测 VM 并强制软件渲染。
          if [ "${{ matrix.target }}" = "linux" ] || [ "${{ matrix.target }}" = "linux-arm64" ]; then
            echo "Creating VM-compatible wrapper script for Linux..."
            cd "$PLATFORM_DIR"
            # 查找主可执行文件（排除 .so 和脚本，找到 ELF 二进制文件）
            FOUND_EXE=""
            for f in *; do
              if [ -f "$f" ] && [ -x "$f" ] && file "$f" | grep -q "ELF.*executable"; then
                FOUND_EXE="$f"
                break
              fi
            done
            if [ -n "$FOUND_EXE" ]; then
              echo "Found executable: $FOUND_EXE"
              mv "$FOUND_EXE" "${FOUND_EXE}.bin"
              cat > "$FOUND_EXE" << 'WRAPPER_EOF'
#!/bin/bash
# Verilog Quiz System - VM-compatible launcher
# Auto-detects VM environment and forces software rendering when needed

IS_VM=false

# Detect VM via CPU flags
if [ -f /proc/cpuinfo ] && grep -qiE "hypervisor|qemu|kvm|vmware" /proc/cpuinfo 2>/dev/null; then
  IS_VM=true
fi

# Detect VM via DMI
if [ -f /sys/class/dmi/id/product_name ] && grep -qiE "virtualbox|vmware|kvm|qemu|bochs" /sys/class/dmi/id/product_name 2>/dev/null; then
  IS_VM=true
fi

# Detect VM via systemd-detect-virt
if command -v systemd-detect-virt >/dev/null 2>&1; then
  VIRT=$(systemd-detect-virt 2>/dev/null)
  if [ -n "$VIRT" ] && [ "$VIRT" != "none" ]; then
    IS_VM=true
  fi
fi

# Force software rendering in VM or when no GPU available
if [ "$IS_VM" = "true" ] || [ ! -d /dev/dri ]; then
  export LIBGL_ALWAYS_SOFTWARE=1
  export GALLIUM_DRIVER=llvmpipe
  export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
  export MESA_GLTHREAD=false
  export GDK_BACKEND=x11
fi

SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
exec "$SCRIPT_DIR/$(basename "$0").bin" "$@"
WRAPPER_EOF
              chmod +x "$FOUND_EXE"
              echo "Wrapper script created for: $FOUND_EXE"
            else
              echo "WARNING: Could not find main ELF executable for wrapper"
            fi
            cd - >/dev/null
          fi

          # ========== 打包 ==========
          mkdir -p release
          ZIP_NAME="verilog-quiz-${{ matrix.target }}.zip"
          if [ "${{ matrix.target }}" = "windows" ]; then
            # Windows: Python 打包整个 dist/ 目录
            python -c "import shutil; shutil.make_archive('release/verilog-quiz-${{ matrix.target }}', 'zip', '$PLATFORM_DIR')"
          elif [ "${{ matrix.target }}" = "macos" ] || [ "${{ matrix.target }}" = "macos-intel" ]; then
            # macOS: 查找 .app bundle（可能在 dist/ 或 dist/macos/ 下），只打包它
            APP_BUNDLE=$(find "$PLATFORM_DIR" -maxdepth 3 -name "*.app" -type d | head -1)
            if [ -n "$APP_BUNDLE" ]; then
              BUNDLE_NAME=$(basename "$APP_BUNDLE")
              BUNDLE_DIR=$(dirname "$APP_BUNDLE")
              echo "Found macOS app bundle: $APP_BUNDLE"
              (cd "$BUNDLE_DIR" && zip -r "$(pwd)/../../release/$ZIP_NAME" "$BUNDLE_NAME")
            else
              echo "WARNING: No .app bundle found, falling back to full directory zip"
              (cd "$PLATFORM_DIR" && zip -r "$(pwd)/../release/$ZIP_NAME" .)
            fi
          else
            # Linux: 用 zip 命令保留 Unix 权限
            (cd "$PLATFORM_DIR" && zip -r "$(pwd)/../release/$ZIP_NAME" .)
          fi
          
          ZIP_SIZE=$(stat -f%z "release/$ZIP_NAME" 2>/dev/null || stat -c%s "release/$ZIP_NAME" 2>/dev/null || echo "0")
          echo "Created: release/$ZIP_NAME (${ZIP_SIZE} bytes)"
          ls -lh release/
          
          # 如果 zip 超过 2GB，使用分卷压缩以适配 upload-artifact
          if [ "$ZIP_SIZE" -gt 2147483648 ]; then
            echo "WARNING: ZIP exceeds 2GB ($ZIP_SIZE bytes), splitting into volumes..."
            rm "release/$ZIP_NAME"
            if [ "${{ matrix.target }}" = "macos" ] || [ "${{ matrix.target }}" = "macos-intel" ]; then
              APP_BUNDLE=$(find "$PLATFORM_DIR" -maxdepth 3 -name "*.app" -type d | head -1)
              if [ -n "$APP_BUNDLE" ]; then
                BUNDLE_NAME=$(basename "$APP_BUNDLE")
                BUNDLE_DIR=$(dirname "$APP_BUNDLE")
                (cd "$BUNDLE_DIR" && zip -r -s 1000m "$(pwd)/../../release/$ZIP_NAME" "$BUNDLE_NAME")
              else
                (cd "$PLATFORM_DIR" && zip -r -s 1000m "$(pwd)/../release/$ZIP_NAME" .)
              fi
            else
              (cd "$PLATFORM_DIR" && zip -r -s 1000m "$(pwd)/../release/$ZIP_NAME" .)
            fi
            echo "Split archives:"
            ls -lh release/
          fi

      # ========== 9. 上传构建产物 ==========
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: verilog-quiz-${{ matrix.target }}
          path: release/*
          retention-days: 30

      # ========== 10. 创建 Release ==========
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## Verilog Quiz System v1.0.${{ github.run_number }}

            自动构建版本（flet build，开箱即用）

            ### 构建信息
            - 提交: ${{ github.sha }}
            - 提交者: ${{ github.event.head_commit.author.name }}
            - 提交信息: ${{ github.event.head_commit.message }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}

            ### 下载说明
            1. 下载对应平台的 **zip 文件**
            2. 解压到任意目录
            3. 运行解压后的程序：
               - **Windows**: 双击 `verilog-quiz-system.exe`
               - **Linux**: `./verilog-quiz-system`
               - **macOS**: 双击应用图标或 `./verilog-quiz-system`

            ### 下载文件
            | 文件 | 平台 | 架构 | 说明 |
            |------|------|------|------|
            | `verilog-quiz-windows.zip` | Windows 10/11 | x64 | 解压后双击 exe 运行 |
            | `verilog-quiz-linux.zip` | Ubuntu 22.04+ | x64 | 解压后赋予执行权限并运行 |
            | `verilog-quiz-linux-arm64.zip` | Ubuntu 24.04+ | ARM64 | 解压后赋予执行权限并运行 |
            | `verilog-quiz-macos.zip` | macOS 14+ | ARM64 (Apple Silicon) | 解压后运行 |
            | `verilog-quiz-macos-intel.zip` | macOS 13+ | x64 (Intel) | 解压后运行 |

            ### macOS 运行注意事项
            由于应用未经过 Apple 签名，首次运行时可能被 Gatekeeper 阻止：
            1. 右键点击应用图标，选择"打开"
            2. 或在终端运行：`xattr -cr verilog-quiz-system.app`
            3. 然后双击应用图标运行

            ### 系统要求
            - **Windows**: Windows 10/11，需预装 iverilog 和 GTKWave
            - **Linux**: Ubuntu 22.04+ (x64) / Ubuntu 24.04+ (ARM64)，需预装 iverilog 和 GTKWave
            - **macOS**: macOS 13+ (Intel) / macOS 14+ (Apple Silicon)，需预装 iverilog 和 GTKWave
          files: release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
