name: Build Release

# main 分支：四平台构建 + 冒烟 + 自动创建 Release 分发
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            exe: verilog-quiz-system.exe
          - os: macos-14
            target: macos-arm64
            exe: verilog-quiz-system
          - os: ubuntu-22.04
            target: linux
            exe: verilog-quiz-system
          - os: ubuntu-24.04-arm
            target: linux-arm64
            exe: verilog-quiz-system

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies and build
        run: |
          uv sync --group dev
          uv run pyinstaller verilog-quiz.spec --noconfirm --clean

      - name: Smoke test (basic)
        shell: bash
        env:
          VERILOG_QUIZ_NO_BROWSER: "1"
          VERILOG_QUIZ_PORT: "8899"
          VERILOG_QUIZ_TOKEN: "ci-token"
          VERILOG_QUIZ_WATCHDOG_TIMEOUT: "600"
        run: |
          ./dist/verilog-quiz-system/${{ matrix.exe }} &
          python scripts/ci_smoke.py --port 8899 --token ci-token

      - name: Full E2E (Linux x64: iverilog/yosys + test question server)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog yosys
          python -c "from setup_test_server import create_test_data; create_test_data()"
          (cd test_server && python -m http.server 8090 --bind 127.0.0.1 &)
          sleep 2
          VERILOG_QUIZ_NO_BROWSER=1 VERILOG_QUIZ_PORT=8899 VERILOG_QUIZ_TOKEN=ci-token \
            VERILOG_QUIZ_WATCHDOG_TIMEOUT=600 \
            VERILOG_QUIZ_SERVER_URL=http://127.0.0.1:8090/verilog-quiz \
            ./dist/verilog-quiz-system/verilog-quiz-system &
          sleep 2
          python scripts/ci_smoke.py --port 8899 --token ci-token --full

      - name: Package zip
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.target }}" = "windows" ]; then
            python -c "import shutil; shutil.make_archive('release/verilog-quiz-${{ matrix.target }}', 'zip', 'dist/verilog-quiz-system')"
          else
            (cd dist/verilog-quiz-system && zip -r "$GITHUB_WORKSPACE/release/verilog-quiz-${{ matrix.target }}.zip" .)
          fi
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: verilog-quiz-${{ matrix.target }}
          path: release/*.zip
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/

      - name: List release files
        run: ls -lh release/*/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Verilog Quiz System v2.0.${{ github.run_number }}
          body: |
            ## Verilog Quiz System v2.0.${{ github.run_number }}

            v2 架构：本地后端 + 浏览器前端，免安装解压即用。无需虚拟机。

            ### 下载

            | 文件 | 平台 |
            |------|------|
            | `verilog-quiz-windows.zip` | Windows 10/11 (x64) |
            | `verilog-quiz-macos-arm64.zip` | macOS (Apple Silicon) |
            | `verilog-quiz-linux.zip` | Linux x64 (Ubuntu 22.04+) |
            | `verilog-quiz-linux-arm64.zip` | Linux ARM64 |

            ### 使用

            1. 解压后双击运行，浏览器自动打开界面
            2. 需预装锁定版本工具：iverilog 11.0 / GTKWave 3.3.104 / Yosys 0.9
            3. 详见仓库内《Manual for EIE330 Students.md》

            ### 构建信息

            - 提交: ${{ github.sha }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}
          files: release/*/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
